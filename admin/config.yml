backend:
  name: github
  repo: elvinothekuhar/dfe-ples
  branch: main
media_folder: "assets/uploads"
public_folder: "/assets/uploads"
site_url: "/"
display_url: "/"
locale: "sl"
collections:
  - name: "programs"
    label: "Programi"
    folder: "content/programs"
    create: true
    format: "json"
    slug: "{{slug}}"
    fields:
      - {label: "Naziv programa", name: "title", widget: "string"}
      - {label: "Kategorija", name: "category", widget: "string"}
      - {label: "Opis", name: "description", widget: "text"}
      - {label: "Aktivno", name: "active", widget: "boolean", default: true}
  - name: "application"
    label: "Prijavnica"
    files:
      - label: "Prijavnica D.F.E."
        name: "application"
        file: "content/application.json"
        fields:
          - {label: "Naslov", name: "title", widget: "string"}
          - {label: "Opis", name: "description", widget: "text"}
          - {label: "PDF prijavnica", name: "file", widget: "file", required: false}
          - {label: "Objavljeno", name: "published", widget: "boolean", default: true}
  - name: "about"
    label: "O D.F.E."
    files:
      - label: "O D.F.E."
        name: "about"
        file: "content/about.json"
        fields:
          - {label: "Naslov", name: "title", widget: "string"}
          - {label: "Glavni stavek", name: "lead", widget: "text"}
          - {label: "DANCE — naslov", name: "danceTitle", widget: "string"}
          - {label: "DANCE — opis", name: "danceText", widget: "text"}
          - {label: "FLOW — naslov", name: "flowTitle", widget: "string"}
          - {label: "FLOW — opis", name: "flowText", widget: "text"}
          - {label: "ELEVATE — naslov", name: "elevateTitle", widget: "string"}
          - {label: "ELEVATE — opis", name: "elevateText", widget: "text"}
          - {label: "Opis šole", name: "schoolText", widget: "text"}
  - name: "contact"
    label: "Kontakt"
    files:
      - label: "Kontakt D.F.E."
        name: "contact"
        file: "content/contact.json"
        fields:
          - {label: "Naslov", name: "heading", widget: "string"}
          - {label: "1. vrstica", name: "heading1", widget: "string"}
          - {label: "2. vrstica", name: "heading2", widget: "string"}
          - {label: "3. vrstica", name: "heading3", widget: "string"}
          - {label: "Lokacija", name: "location", widget: "string"}
          - {label: "Naslov", name: "address", widget: "string"}
          - {label: "Mesto", name: "city", widget: "string"}
          - {label: "Telefon", name: "phone", widget: "string"}
          - {label: "E-mail", name: "email", widget: "string"}
